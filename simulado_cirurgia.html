<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulado de Cirurgia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#030504;
  --surface:#0a0e0b;
  --surface-2:#0f1511;
  --surface-3:#152019;
  --line:rgba(74,222,128,.11);
  --line-2:rgba(74,222,128,.22);
  --green:#166534;
  --green-2:#15803d;
  --accent:#4ade80;
  --accent-dim:rgba(74,222,128,.13);
  --text:#e5efe8;
  --text-2:#b6c6bc;
  --muted:#7d9186;
  --ok:#3fb97c;
  --ok-bg:rgba(63,185,124,.10);
  --err:#e2575c;
  --err-bg:rgba(226,87,92,.09);
  --sans:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{ color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(3,5,4,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:880px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:8px}
.counter{font-family:var(--mono);font-size:14px;color:var(--text-2);margin:0 auto 0 8px;white-space:nowrap}
.counter b{color:var(--accent);font-weight:500}
.counter .mode{color:var(--muted);font-size:12px;margin-left:8px}
.tb-btn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13.5px;color:var(--text-2);cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
.tb-btn:hover{border-color:var(--line-2);color:var(--text)}
.tb-btn.primary{border-color:var(--green-2);background:var(--green);color:#effcf3}
.tb-btn.primary:hover{background:var(--green-2)}
.tb-btn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.progress{max-width:880px;margin:0 auto;padding:0 20px 10px;display:flex;gap:2px}
.seg{flex:1;min-width:0;height:5px;border-radius:2px;background:var(--surface-3);border:0;padding:0;cursor:pointer;position:relative}
.seg.ok{background:var(--ok)}
.seg.err{background:var(--err)}
.seg.cur{box-shadow:0 0 0 1.5px var(--accent);background:var(--accent-dim)}
.seg.cur.ok{background:var(--ok)}
.seg.cur.err{background:var(--err)}
.seg::after{content:"";position:absolute;inset:-8px 0}

/* ---------- layout ---------- */
main{max-width:880px;margin:0 auto;padding:32px 20px 80px}
.view[hidden]{display:none}

/* ---------- start ---------- */
.start{min-height:calc(100vh - 160px);display:flex;flex-direction:column;justify-content:center;max-width:620px}
.start .kicker{font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.02em;margin:0 0 18px;display:flex;align-items:center;gap:10px}
.start .kicker::before{content:"";width:22px;height:1px;background:var(--accent)}
.start h1{font-weight:300;font-size:clamp(34px,6.4vw,56px);line-height:1.05;letter-spacing:-.02em;margin:0 0 20px}
.start p{color:var(--text-2);margin:0 0 30px;max-width:52ch}
.bank[hidden]{display:none}
.bank{margin-top:22px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:13.5px}
.bank-label{color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13.5px;text-decoration:underline;text-decoration-color:rgba(74,222,128,.35);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--accent)}
.figure img{display:block;max-width:100%;height:auto;border-radius:6px}
.start p.author{font-size:15px;color:var(--accent);margin:-6px 0 14px}
.stats{display:flex;gap:32px;margin:0 0 36px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat .n{font-family:var(--mono);font-size:26px;color:var(--text);line-height:1.2}
.stat .l{font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:1px solid var(--line-2);background:transparent;color:var(--text);border-radius:var(--r);padding:12px 22px;font-size:15px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--green);border-color:var(--green-2);color:#effcf3}
.btn.primary:hover{background:var(--green-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.keys{margin-top:34px;display:flex;flex-wrap:wrap;gap:18px;font-size:13px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text-2);background:var(--surface)}

/* ---------- question ---------- */
.q-meta{display:flex;align-items:baseline;gap:14px;margin:0 0 18px;flex-wrap:wrap}
.q-num{font-family:var(--mono);font-size:13px;color:var(--accent);border:1px solid var(--accent-dim);background:var(--accent-dim);border-radius:6px;padding:2px 8px}
.q-tema{font-size:13.5px;color:var(--muted)}
.q-case{font-size:17px;line-height:1.72;color:var(--text);max-width:70ch;margin:0 0 20px}
.q-ask{font-size:17px;font-weight:500;color:#f2fbf5;max-width:70ch;margin:0 0 22px}
.figure{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 22px;overflow-x:auto}
.figure svg{display:block;min-width:540px;width:100%;height:auto;max-width:680px}
.figure figcaption{font-size:12.5px;color:var(--muted);margin-top:8px}
.g-line{stroke:var(--text-2);stroke-width:1.5;fill:none}
.g-rel{stroke:var(--accent);stroke-width:1.4;fill:none}
.g-sym{fill:var(--surface-2);stroke:var(--text);stroke-width:1.5}
.g-idx{fill:none;stroke:var(--accent);stroke-width:1.3}
.g-txt{fill:var(--text);font:500 12.5px var(--sans)}
.g-sub{fill:var(--muted);font:400 11.5px var(--sans)}
.g-leg{fill:var(--text-2);font:400 12px var(--sans)}

.opts{display:flex;flex-direction:column;gap:10px;margin:0 0 26px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;font-size:15.5px;line-height:1.55;color:var(--text);transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--green-2);background:var(--surface-2)}
.opt:disabled{cursor:default}
.opt .key{font-family:var(--mono);font-size:13px;flex:0 0 28px;height:28px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:7px;color:var(--text-2);margin-top:-1px}
.opt.dim{opacity:.5}
.opt.right{border-color:var(--ok);background:var(--ok-bg);opacity:1}
.opt.right .key{border-color:var(--ok);background:var(--ok);color:#04130b}
.opt.wrong{border-color:var(--err);background:var(--err-bg);opacity:1}
.opt.wrong .key{border-color:var(--err);background:var(--err);color:#1a0405}

.fb{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;margin:0 0 28px}
.fb-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:500}
.fb-head .dot{width:9px;height:9px;border-radius:50%}
.fb.is-ok .fb-head{color:var(--ok)} .fb.is-ok .dot{background:var(--ok)}
.fb.is-err .fb-head{color:var(--err)} .fb.is-err .dot{background:var(--err)}
.fb-head .gab{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--text-2);font-weight:400}
.fb-body{padding:6px 18px 16px}
.fb-sec{padding:12px 0;border-bottom:1px solid var(--line)}
.fb-sec:last-child{border-bottom:0}
.fb-sec h3{font-size:13px;font-weight:500;color:var(--accent);margin:0 0 4px}
.fb-sec p{margin:0;color:var(--text-2);font-size:15px;max-width:72ch}
.fb-steps{margin:6px 0 0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:7px}
.fb-steps li{counter-increment:st;display:flex;gap:10px;font-size:14.5px;color:var(--text-2);line-height:1.5}
.fb-steps li::before{content:counter(st,decimal-leading-zero);font-family:var(--mono);font-size:12px;color:var(--accent);flex:0 0 22px;padding-top:2px}
.fb-alts{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.fb-alts li{display:flex;gap:10px;font-size:14.5px;color:var(--text-2);line-height:1.5}
.fb-alts .k{font-family:var(--mono);color:var(--err);flex:0 0 18px}

.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav .spacer{flex:1}
.nav .hint{font-size:12.5px;color:var(--muted)}

/* ---------- result ---------- */
.result h2{font-weight:300;font-size:28px;margin:0 0 26px;letter-spacing:-.01em}
.score{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 28px}
.pct{font-family:var(--mono);font-size:clamp(64px,14vw,104px);line-height:.9;font-weight:500;color:var(--accent);letter-spacing:-.04em}
.pct small{font-size:.4em;color:var(--muted);margin-left:4px}
.breakdown{display:flex;gap:28px;padding-bottom:6px}
.breakdown .n{font-family:var(--mono);font-size:24px}
.breakdown .l{font-size:13px;color:var(--muted)}
.n.ok{color:var(--ok)} .n.err{color:var(--err)} .n.blank{color:var(--text-2)}
.result .summary{color:var(--text-2);margin:0 0 26px;max-width:60ch}
.topics{margin:34px 0 0;border-top:1px solid var(--line);padding-top:24px;max-width:720px}
.topics h3{font-size:16px;font-weight:500;margin:0 0 6px}
.topics-tip{color:var(--text-2);font-size:14.5px;margin:0 0 16px}
.topics ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.topics li{display:grid;grid-template-columns:minmax(0,1fr) 120px 110px;align-items:center;gap:14px;font-size:14.5px}
.topics .tn{color:var(--text)}
.topics .tbar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.topics .tbar i{display:block;height:100%;border-radius:3px}
.topics li.good .tbar i{background:var(--ok)} .topics li.mid .tbar i{background:var(--accent)} .topics li.bad .tbar i{background:var(--err)}
.topics .tv{font-family:var(--mono);font-size:12.5px;color:var(--text-2);text-align:right}
.topics li.bad .tv{color:var(--err)}
@media (max-width:640px){.topics li{grid-template-columns:minmax(0,1fr) 92px;row-gap:4px}.topics .tbar{grid-column:1/-1;grid-row:2}}
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px;margin:30px 0 0;max-width:620px}

/* ---------- map ---------- */
.map{position:absolute;right:20px;top:calc(100% + 6px);width:min(420px,calc(100vw - 32px));max-height:min(70vh,560px);overflow-y:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.map[hidden]{display:none}
.map-wrap{max-width:880px;margin:0 auto;position:relative}
.filters{display:flex;gap:6px;margin:0 0 12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--text-2);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cell{font-family:var(--mono);font-size:12px;height:32px;padding:0;border-radius:7px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-2);cursor:pointer}
.cell.ok{border-color:rgba(63,185,124,.6);color:var(--ok);background:var(--ok-bg)}
.cell.err{border-color:rgba(226,87,92,.6);color:var(--err);background:var(--err-bg)}
.cell.cur{outline:1.5px solid var(--accent);outline-offset:1px}
.map-empty{font-size:13px;color:var(--muted);padding:8px 2px}
.map-legend{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
.map-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(2,4,3,.72);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.modal-box{width:min(420px,100%);background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:22px}
.modal-box h3{margin:0 0 8px;font-size:17px;font-weight:500}
.modal-box p{margin:0 0 20px;color:var(--text-2);font-size:15px}
.modal-box .actions{justify-content:flex-end}

@media (max-width:640px){
  main{padding:24px 16px 64px}
  .topbar-inner{padding:8px 12px;gap:6px;flex-wrap:wrap}
  .progress{padding:0 12px 8px}
  .tb-btn{padding:5px 9px;font-size:12.5px}
  .counter{order:-1;flex-basis:100%;margin:0 0 4px 2px}
  .q-case,.q-ask{font-size:16px}
  .map{right:16px}
  .cells{grid-template-columns:repeat(7,1fr)}
  .stats{gap:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="topbar" id="topbar" hidden>
  <div class="topbar-inner">
    <button class="tb-btn" id="btnHome" type="button">Início</button>
    <div class="counter" id="counter" aria-live="polite"></div>
    <button class="tb-btn" id="btnMap" type="button" aria-expanded="false" aria-controls="map">Mapa</button>
    <button class="tb-btn" id="btnReset" type="button">Reiniciar</button>
    <button class="tb-btn primary" id="btnFinish" type="button">Finalizar</button>
  </div>
  <div class="progress" id="progress" aria-label="Progresso"></div>
  <div class="map-wrap">
    <div class="map" id="map" hidden role="dialog" aria-label="Mapa de questões">
      <div class="filters" role="group" aria-label="Filtrar questões">
        <button class="chip" data-f="all" aria-pressed="true" type="button">Todas</button>
        <button class="chip" data-f="err" aria-pressed="false" type="button">Erradas</button>
        <button class="chip" data-f="blank" aria-pressed="false" type="button">Em branco</button>
      </div>
      <div class="cells" id="cells"></div>
      <div class="map-legend"><span><i style="background:var(--ok)"></i>Certa</span><span><i style="background:var(--err)"></i>Errada</span><span><i style="background:var(--surface-3);border:1px solid var(--line-2)"></i>Em branco</span></div>
    </div>
  </div>
</header>

<main>
  <section class="view start" id="vStart">
    <p class="kicker" id="cArea"></p>
    <h1 id="cTitulo"></h1>
    <p class="author" id="cAutor"></p>
    <p id="cDesc"></p>
    <div class="stats">
      <div class="stat"><div class="n" id="sTotal">70</div><div class="l">questões</div></div>
      <div class="stat"><div class="n" id="sDone">0</div><div class="l">respondidas</div></div>
      <div class="stat"><div class="n" id="sAlt">4</div><div class="l">alternativas cada</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="btnStart" type="button">Iniciar</button>
      <button class="btn" id="btnFresh" type="button" hidden>Começar do zero</button>
    </div>
    <div class="bank" hidden>
      <span class="bank-label" id="bankLabel"></span>
      <button class="link" id="btnLoad" type="button">Carregar questões (.json)</button>
      <button class="link" id="btnModel" type="button">Baixar modelo</button>
      <button class="link" id="btnDefault" type="button" hidden>Voltar ao banco padrão</button>
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
    </div>
    <div class="keys">
      <span id="keysAns"><kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> responder</span>
      <span><kbd>Enter</kbd> avançar</span>
      <span><kbd>←</kbd> <kbd>→</kbd> navegar</span>
    </div>
  </section>

  <section class="view" id="vQuiz" hidden></section>
  <section class="view result" id="vResult" hidden></section>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mText">
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <div class="actions">
      <button class="btn" id="mCancel" type="button">Cancelar</button>
      <button class="btn primary" id="mOk" type="button">Confirmar</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — edite estes textos para cada matéria
   ===================================================================== */
const CONFIG = {
  area: "Cirurgia",
  titulo: "Simulado de Cirurgia",
  autor: "Geraldo Sandoval",
  descricao: "Casos clínicos de ambiente cirúrgico, abordagem inicial ao queimado, cicatrização e cicatrização patológica.",
  embaralhar: true
};

/* =====================================================================
   BANCO DE QUESTÕES PADRÃO
   Formato de cada questão:
   {
     "assunto":   "Tema usado no relatório final",
     "caso":      "Enunciado / caso clínico",
     "pergunta":  "Pergunta final",
     "opcoes":    ["alt A", "alt B", "alt C", "alt D"],   // 2 a 5 alternativas
     "correta":   "C",                                    // letra (ou índice 0-4)
     "pista":     "Pista principal do caso",              // opcional
     "conceito":  "Conceito testado",                     // opcional
     "explicacao":"Explicação livre",                     // opcional
     "erros":     { "A": "erro de A", "B": "...", "D": "..." },  // opcional
     "figura":    "<svg>...</svg>",                       // opcional (SVG/HTML)
     "imagem":    "https://... ou data:image/...",        // opcional
     "legenda":   "Legenda da figura"                     // opcional
   }
   Também é possível carregar um arquivo .json pelo botão da tela inicial,
   sem editar este código: { "config": {...}, "questoes": [ ... ] }
   ===================================================================== */
const BANCO_PADRAO = [
 {
  "assunto": "Ambiente cirúrgico",
  "caso": "Às 7h30, a sala 3 está montada para uma artroplastia de quadril: caixas de instrumental abertas sobre a mesa auxiliar e o paciente ainda na recepção do centro cirúrgico. A circulante, de roupa privativa e touca, entra sem máscara para buscar um frasco de soro, alegando que 'a cirurgia ainda não começou', e deixa a porta aberta para facilitar a passagem da maca.",
  "pergunta": "Qual é a conduta correta nessa sala?",
  "opcoes": [
   "Máscara obrigatória já com material estéril aberto, portas fechadas e circulação mínima",
   "Máscara obrigatória apenas para a equipe paramentada, com portas fechadas e circulação mínima",
   "Máscara obrigatória apenas após a incisão, com portas abertas até o posicionamento",
   "Máscara obrigatória apenas após a entrada do paciente, com portas fechadas e circulação mínima"
  ],
  "correta": "A",
  "pista": "Material estéril já aberto, mesmo sem paciente na sala.",
  "conceito": "Na zona restrita (sala operatória e áreas com material estéril aberto) exigem-se roupa privativa, cobertura completa dos cabelos, máscara quando houver campo ou material estéril aberto, portas fechadas e circulação mínima. A regra prática é entrar com propósito claro e sair levando o que não precisa permanecer.",
  "raciocinio": [
   "Classificar a sala: restrita, com material estéril aberto.",
   "Identificar o gatilho da máscara: material aberto, e não paciente ou incisão.",
   "Corrigir: máscara, porta fechada e circulação mínima."
  ],
  "erros": {
   "B": "A máscara vale para todos na sala quando há campo ou material estéril aberto.",
   "C": "O gatilho não é a incisão, e a porta deve permanecer fechada.",
   "D": "A exigência decorre do material estéril aberto, não da presença do paciente."
  }
 },

/* =====================================================================
   MOTOR (não precisa editar daqui para baixo)
   ===================================================================== */
const LETTERS = ["A","B","C","D","E"];
const BANK_KEY = "simulado-cirurgia-banco";

function toIdx(v){
  if(typeof v==="number" && Number.isInteger(v)) return v;
  if(typeof v==="string"){
    const t=v.trim().toUpperCase();
    if(/^[A-E]$/.test(t)) return LETTERS.indexOf(t);
    if(/^\d+$/.test(t)) return +t;
  }
  return -1;
}
function normalizar(lista){
  if(!Array.isArray(lista) || !lista.length) throw new Error("Nenhuma questão encontrada no arquivo.");
  return lista.map((q,k)=>{
    const n=k+1;
    if(!q || typeof q!=="object") throw new Error(`Questão ${n}: formato inválido.`);
    const opcoes = q.opcoes || q.alternativas;
    if(!Array.isArray(opcoes) || opcoes.length<2 || opcoes.length>5) throw new Error(`Questão ${n}: use de 2 a 5 alternativas em "opcoes".`);
    const correta = toIdx(q.correta ?? q.gabarito);
    if(correta<0 || correta>=opcoes.length) throw new Error(`Questão ${n}: "correta" deve ser uma letra de A a ${LETTERS[opcoes.length-1]}.`);
    if(!q.caso && !q.pergunta) throw new Error(`Questão ${n}: falta "caso" ou "pergunta".`);
    const erros={};
    if(q.erros && typeof q.erros==="object"){
      for(const [key,val] of Object.entries(q.erros)){
        const i=toIdx(key);
        if(i>=0 && i<opcoes.length && i!==correta && val) erros[i]=String(val);
      }
    }
    return {
      assunto:String(q.assunto || q.tema || "Geral"),
      caso:String(q.caso||""), pergunta:String(q.pergunta||""),
      opcoes:opcoes.map(String), correta,
      pista:String(q.pista||""), conceito:String(q.conceito||""), explicacao:String(q.explicacao||""),
      raciocinio: Array.isArray(q.raciocinio) ? q.raciocinio.map(String) : (q.raciocinio ? [String(q.raciocinio)] : []),
      erros, figura:String(q.figura||""), imagem:String(q.imagem||""), legenda:String(q.legenda||"")
    };
  });
}
function hashStr(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36); }

let CFG = Object.assign({}, CONFIG), BANCO, PERSONALIZADO = false, ERRO_BANCO = "";
try{
  const raw = localStorage.getItem(BANK_KEY);
  if(raw){ const d=JSON.parse(raw); BANCO=normalizar(d.questoes); CFG=Object.assign({},CONFIG,d.config||{}); PERSONALIZADO=true; }
}catch(e){ BANCO=null; PERSONALIZADO=false; }
if(!BANCO){
  try{ BANCO = normalizar(BANCO_PADRAO); }
  catch(e){ ERRO_BANCO = e.message; BANCO = normalizar([{assunto:"Erro",pergunta:"O banco de questões padrão tem um erro: "+e.message,opcoes:["Ok","Ok"],correta:"A"}]); }
}
const BANK_HASH = hashStr(JSON.stringify(BANCO));

/* ordem: embaralhada de forma estável, evitando o mesmo assunto em sequência */
function ordenar(){
  const idx = BANCO.map((_,i)=>i);
  if(CFG.embaralhar===false) return idx;
  let seed = parseInt(BANK_HASH,36) || 1;
  const rnd = ()=>{ seed=(Math.imul(seed,1103515245)+12345)>>>0; return (seed>>>1)/0x7fffffff; };
  for(let tent=0; tent<60; tent++){
    const pool=idx.slice(), out=[];
    while(pool.length){
      const prev = out.length ? BANCO[out[out.length-1]].assunto : null;
      let c = pool.filter(i=>BANCO[i].assunto!==prev);
      if(!c.length) c = pool;
      const pick = c[Math.floor(rnd()*c.length)];
      out.push(pick); pool.splice(pool.indexOf(pick),1);
    }
    const ok = out.every((x,k)=>k===0 || BANCO[x].assunto!==BANCO[out[k-1]].assunto);
    if(ok || tent===59) return out;
  }
  return idx;
}
const QUESTIONS = ordenar().map(i=>BANCO[i]);

/* =====================================================================
   ESTADO E PERSISTÊNCIA
   ===================================================================== */
const KEY = "simulado-cirurgia-" + BANK_HASH;
const ALL = QUESTIONS.map((_,i)=>i);

function freshState(){ return { set:ALL.slice(), answers:{}, pos:0, view:"start", mode:"full", mapFilter:"all" }; }
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return freshState();
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.set) || !d.set.length || d.set.some(i=>typeof i!=="number"||i<0||i>=QUESTIONS.length)) return freshState();
    const st = Object.assign(freshState(), d);
    st.pos = Math.min(Math.max(0, st.pos|0), st.set.length-1);
    return st;
  }catch(e){ return freshState(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const isAnswered = id => Object.prototype.hasOwnProperty.call(S.answers, id);
const isRight = id => isAnswered(id) && S.answers[id] === QUESTIONS[id].correta;
function tally(){
  let ok=0, err=0, blank=0;
  S.set.forEach(id=>{ if(!isAnswered(id)) blank++; else if(isRight(id)) ok++; else err++; });
  return {ok,err,blank,total:S.set.length};
}

/* =====================================================================
   RENDER
   ===================================================================== */
const $ = s => document.querySelector(s);
const vStart=$("#vStart"), vQuiz=$("#vQuiz"), vResult=$("#vResult"), topbar=$("#topbar");

function render(){
  vStart.hidden = S.view!=="start";
  vQuiz.hidden = S.view!=="quiz";
  vResult.hidden = S.view!=="result";
  topbar.hidden = S.view==="start";
  if(S.view==="start") renderStart();
  if(S.view==="quiz") renderQuiz();
  if(S.view==="result") renderResult();
  renderChrome();
  save();
}

function renderStart(){
  const answered = Object.keys(S.answers).length;
  $("#sTotal").textContent = QUESTIONS.length;
  $("#sDone").textContent = answered;
  const hasProgress = answered>0 || S.pos>0 || S.mode!=="full";
  $("#btnStart").textContent = hasProgress ? "Continuar" : "Iniciar";
  $("#btnFresh").hidden = !hasProgress;
  const setTxt=(sel,txt)=>{ const el=$(sel); el.textContent=txt||""; el.hidden=!txt; };
  setTxt("#cArea", CFG.area); setTxt("#cTitulo", CFG.titulo || "Simulado");
  setTxt("#cAutor", CFG.autor ? "por "+CFG.autor : ""); setTxt("#cDesc", CFG.descricao);
  document.title = CFG.titulo || "Simulado";
  const ns=[...new Set(QUESTIONS.map(q=>q.opcoes.length))];
  $("#sAlt").textContent = ns.length===1 ? ns[0] : Math.min(...ns)+"–"+Math.max(...ns);
  const maxN=Math.max(...ns);
  $("#keysAns").innerHTML = LETTERS.slice(0,maxN).map(l=>`<kbd>${l}</kbd>`).join(" ")+" responder";
  $("#bankLabel").textContent = PERSONALIZADO ? "Banco carregado de arquivo." : "Banco padrão do arquivo.";
  $("#btnDefault").hidden = !PERSONALIZADO;
}

function renderChrome(){
  const t = tally();
  const pad = n => String(n).padStart(2,"0");
  $("#counter").innerHTML = S.view==="result"
    ? `Resultado <span class="mode">${t.ok}/${t.total}</span>`
    : `<b>${pad(S.pos+1)}</b> / ${pad(S.set.length)}${S.mode==="retry"?'<span class="mode">refazendo erradas</span>':''}`;
  $("#btnFinish").textContent = S.view==="result" ? "Resultado" : "Finalizar";
  // barra segmentada
  const prog = $("#progress");
  prog.innerHTML = S.set.map((id,p)=>{
    const cls = ["seg"];
    if(isAnswered(id)) cls.push(isRight(id)?"ok":"err");
    if(p===S.pos && S.view==="quiz") cls.push("cur");
    const st = !isAnswered(id)?"em branco":(isRight(id)?"certa":"errada");
    return `<button type="button" class="${cls.join(" ")}" data-p="${p}" aria-label="Questão ${p+1}, ${st}"></button>`;
  }).join("");
  renderMap();
}

function renderMap(){
  const f = S.mapFilter;
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", String(c.dataset.f===f)));
  const items = S.set.map((id,p)=>({id,p})).filter(({id})=>{
    if(f==="err") return isAnswered(id) && !isRight(id);
    if(f==="blank") return !isAnswered(id);
    return true;
  });
  $("#cells").innerHTML = items.length
    ? items.map(({id,p})=>{
        const cls=["cell"];
        if(isAnswered(id)) cls.push(isRight(id)?"ok":"err");
        if(p===S.pos && S.view==="quiz") cls.push("cur");
        return `<button type="button" class="${cls.join(" ")}" data-p="${p}">${String(p+1).padStart(2,"0")}</button>`;
      }).join("")
    : `<div class="map-empty" style="grid-column:1/-1">${f==="err"?"Nenhuma questão errada.":"Nenhuma questão em branco."}</div>`;
}

function renderQuiz(){
  const id = S.set[S.pos];
  const q = QUESTIONS[id];
  const ans = isAnswered(id) ? S.answers[id] : null;
  const done = ans!==null;
  const last = S.pos===S.set.length-1;

  const opts = q.opcoes.map((txt,i)=>{
    let cls="opt";
    if(done){
      if(i===q.correta) cls+=" right";
      else if(i===ans) cls+=" wrong";
      else cls+=" dim";
    }
    return `<button type="button" class="${cls}" data-i="${i}" ${done?"disabled":""}><span class="key">${LETTERS[i]}</span><span>${txt}</span></button>`;
  }).join("");

  let fb="";
  if(done){
    const ok = ans===q.correta;
    const alts = Object.keys(q.erros).map(Number).sort((a,b)=>a-b)
      .map(i=>`<li><span class="k">${LETTERS[i]}</span><span>${q.erros[i]}</span></li>`).join("");
    fb = `<div class="fb ${ok?"is-ok":"is-err"}" role="status">
      <div class="fb-head"><span class="dot"></span>${ok?"Resposta correta":"Resposta incorreta"}<span class="gab">Gabarito: ${LETTERS[q.correta]}</span></div>
      <div class="fb-body">
        ${q.pista?`<div class="fb-sec"><h3>Pista do caso</h3><p>${q.pista}</p></div>`:""}
        ${q.raciocinio && q.raciocinio.length?`<div class="fb-sec"><h3>Raciocínio esperado</h3><ol class="fb-steps">${q.raciocinio.map(r=>`<li>${r}</li>`).join("")}</ol></div>`:""}
        ${q.conceito?`<div class="fb-sec"><h3>Conceito testado</h3><p>${q.conceito}</p></div>`:""}
        ${q.explicacao?`<div class="fb-sec"><h3>Explicação</h3><p>${q.explicacao}</p></div>`:""}
        ${alts?`<div class="fb-sec"><h3>Análise das alternativas</h3><ul class="fb-alts">${alts}</ul></div>`:""}
      </div></div>`;
  }

  const cap = q.legenda ? `<figcaption>${q.legenda}</figcaption>` : "";
  const fig = q.figura ? `<figure class="figure">${q.figura}${cap}</figure>`
            : q.imagem ? `<figure class="figure"><img src="${q.imagem}" alt="${q.legenda||"Imagem da questão"}">${cap}</figure>` : "";

  vQuiz.innerHTML = `
    <div class="q-meta"><span class="q-num">Questão ${String(S.pos+1).padStart(2,"0")}</span></div>
    ${q.caso?`<p class="q-case">${q.caso}</p>`:""}
    ${fig}
    <p class="q-ask">${q.pergunta}</p>
    <div class="opts" role="group" aria-label="Alternativas">${opts}</div>
    ${fb}
    <div class="nav">
      <button type="button" class="btn" id="bPrev" ${S.pos===0?"disabled":""}>Anterior</button>
      <span class="spacer"></span>
      <span class="hint">${done?"<kbd>Enter</kbd> para avançar":`<kbd>A</kbd>–<kbd>${LETTERS[q.opcoes.length-1]}</kbd> para responder`}</span>
      <button type="button" class="btn primary" id="bNext">${last?"Ver resultado":"Próxima"}</button>
    </div>`;
}

function renderResult(){
  const t = tally();
  const pct = t.total ? Math.round(t.ok/t.total*100) : 0;
  let msg;
  if(t.blank===t.total) msg = "Nenhuma questão foi respondida ainda.";
  else if(pct>=80) msg = "Desempenho sólido. Revise as erradas para fechar as lacunas restantes.";
  else if(pct>=60) msg = "Bom caminho. Refaça as erradas e releia a análise das alternativas de cada uma.";
  else msg = "Vale revisar cada questão com calma: a pista do caso mostra onde o raciocínio deveria ancorar.";
  const wrongCount = t.err;
  vResult.innerHTML = `
    <h2>${S.mode==="retry"?"Resultado — refazendo erradas":"Resultado do simulado"}</h2>
    <div class="score">
      <div class="pct">${pct}<small>%</small></div>
      <div class="breakdown">
        <div><div class="n ok">${t.ok}</div><div class="l">acertos</div></div>
        <div><div class="n err">${t.err}</div><div class="l">erros</div></div>
        <div><div class="n blank">${t.blank}</div><div class="l">em branco</div></div>
      </div>
    </div>
    <p class="summary">${msg}</p>
    <div class="actions">
      <button type="button" class="btn primary" id="rReview">Revisar questões</button>
      <button type="button" class="btn" id="rRetry" ${wrongCount?"":"disabled"}>Refazer erradas${wrongCount?` (${wrongCount})`:""}</button>
      <button type="button" class="btn" id="rHome">Início</button>
    </div>
    ${topicReport()}
    <div class="result-grid">${S.set.map((id,p)=>{
      const cls=["cell"]; if(isAnswered(id)) cls.push(isRight(id)?"ok":"err");
      return `<button type="button" class="${cls.join(" ")}" data-p="${p}" aria-label="Revisar questão ${p+1}">${String(p+1).padStart(2,"0")}</button>`;
    }).join("")}</div>`;
}

function topicReport(){
  const g={};
  S.set.forEach(id=>{ const t=QUESTIONS[id].assunto; g[t]=g[t]||{ok:0,n:0}; g[t].n++; if(isRight(id)) g[t].ok++; });
  const rows=Object.keys(g).map(t=>({t,ok:g[t].ok,n:g[t].n,r:g[t].ok/g[t].n}))
    .sort((a,b)=>a.r-b.r||a.t.localeCompare(b.t,"pt-BR"));
  const weak=rows.filter(x=>x.r<0.5).map(x=>x.t);
  const tip = weak.length ? `Priorize a revisão de: ${weak.join(", ")}.` : "Nenhum assunto abaixo de 50% de acerto.";
  return `<div class="topics"><h3>Desempenho por assunto</h3><p class="topics-tip">${tip}</p><ul>${rows.map(x=>{
    const cls = x.r>=0.75?"good":(x.r>=0.5?"mid":"bad");
    return `<li class="${cls}"><span class="tn">${x.t}</span><span class="tbar"><i style="width:${Math.round(x.r*100)}%"></i></span><span class="tv">acertou ${x.ok} de ${x.n}</span></li>`;
  }).join("")}</ul></div>`;
}

/* =====================================================================
   AÇÕES
   ===================================================================== */
function go(p){
  if(p<0||p>=S.set.length) return;
  S.pos=p; S.view="quiz"; closeMap(); render();
  window.scrollTo({top:0,behavior:"auto"});
}
function answer(i){
  const id=S.set[S.pos];
  if(S.view!=="quiz"||isAnswered(id)||i<0||i>=QUESTIONS[id].opcoes.length) return;
  S.answers[id]=i; render();
  const fb=document.querySelector(".fb");
  if(fb) fb.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest"});
}
function next(){
  if(S.pos<S.set.length-1) go(S.pos+1);
  else finish();
}
function finish(){
  const t=tally();
  if(S.view==="result") return;
  if(t.blank>0){
    confirmBox("Finalizar simulado?", `Há ${t.blank} ${t.blank===1?"questão":"questões"} em branco. Elas serão contadas como não respondidas.`, "Finalizar", ()=>{ S.view="result"; closeMap(); render(); window.scrollTo(0,0); });
  } else { S.view="result"; closeMap(); render(); window.scrollTo(0,0); }
}
function retryWrong(){
  const wrong=S.set.filter(id=>isAnswered(id)&&!isRight(id));
  if(!wrong.length) return;
  wrong.forEach(id=>delete S.answers[id]);
  S.set=wrong; S.pos=0; S.mode="retry"; S.view="quiz"; S.mapFilter="all";
  render(); window.scrollTo(0,0);
}
function resetAll(){
  confirmBox("Reiniciar simulado?", "Todas as respostas serão apagadas e o simulado volta para a questão 1.", "Reiniciar", ()=>{
    S=freshState(); S.view="quiz"; render(); window.scrollTo(0,0);
  });
}

/* ---------- mapa ---------- */
const mapEl=$("#map"), mapBtn=$("#btnMap");
function openMap(){ mapEl.hidden=false; mapBtn.setAttribute("aria-expanded","true"); renderMap(); }
function closeMap(){ mapEl.hidden=true; mapBtn.setAttribute("aria-expanded","false"); }
mapBtn.addEventListener("click",e=>{ e.stopPropagation(); mapEl.hidden?openMap():closeMap(); });
mapEl.addEventListener("click",e=>{
  e.stopPropagation();
  const chip=e.target.closest(".chip");
  if(chip){ S.mapFilter=chip.dataset.f; renderMap(); save(); return; }
  const cell=e.target.closest(".cell");
  if(cell) go(+cell.dataset.p);
});
document.addEventListener("click",e=>{ if(!mapEl.hidden && !mapEl.contains(e.target)) closeMap(); });

/* ---------- modal ---------- */
const modal=$("#modal"); let modalCb=null, lastFocus=null;
function alertBox(title,text){ confirmBox(title,text,"Ok",null); $("#mCancel").hidden=true; }
function confirmBox(title,text,okLabel,cb){
  $("#mCancel").hidden=false;
  $("#mTitle").textContent=title; $("#mText").textContent=text; $("#mOk").textContent=okLabel;
  modalCb=cb; lastFocus=document.activeElement; modal.hidden=false; $("#mOk").focus();
}
function closeModal(run){
  modal.hidden=true; const cb=modalCb; modalCb=null;
  if(run&&cb) cb(); else if(lastFocus) lastFocus.focus();
}
$("#mOk").addEventListener("click",()=>closeModal(true));
$("#mCancel").addEventListener("click",()=>closeModal(false));
modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(false); });

/* ---------- botões fixos ---------- */
$("#btnStart").addEventListener("click",()=>{ S.view="quiz"; render(); window.scrollTo(0,0); });
$("#btnFresh").addEventListener("click",()=>{
  confirmBox("Começar do zero?","As respostas salvas serão apagadas.","Começar",()=>{ S=freshState(); S.view="quiz"; render(); window.scrollTo(0,0); });
});
$("#btnHome").addEventListener("click",()=>{ closeMap(); S.view="start"; render(); window.scrollTo(0,0); });
$("#btnReset").addEventListener("click",()=>{ closeMap(); resetAll(); });
$("#btnFinish").addEventListener("click",()=>{ closeMap(); finish(); });
$("#progress").addEventListener("click",e=>{ const b=e.target.closest(".seg"); if(b) go(+b.dataset.p); });

vQuiz.addEventListener("click",e=>{
  const o=e.target.closest(".opt"); if(o){ answer(+o.dataset.i); return; }
  if(e.target.closest("#bPrev")) go(S.pos-1);
  if(e.target.closest("#bNext")) next();
});
vResult.addEventListener("click",e=>{
  if(e.target.closest("#rReview")) go(0);
  else if(e.target.closest("#rRetry")) retryWrong();
  else if(e.target.closest("#rHome")){ S.view="start"; render(); window.scrollTo(0,0); }
  else { const c=e.target.closest(".cell"); if(c) go(+c.dataset.p); }
});

/* ---------- teclado ---------- */
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(!modal.hidden){
    if(e.key==="Escape"){ e.preventDefault(); closeModal(false); }
    return;
  }
  if(e.key==="Escape" && !mapEl.hidden){ closeMap(); mapBtn.focus(); return; }
  if(S.view==="start"){
    if(e.key==="Enter" && document.activeElement===document.body){ e.preventDefault(); $("#btnStart").click(); }
    return;
  }
  if(S.view!=="quiz") return;
  const k=e.key.toLowerCase();
  const idx="abcde".indexOf(k);
  if(idx>-1 && k.length===1){ e.preventDefault(); answer(idx); return; }
  if(e.key==="Enter"){
    const a=document.activeElement;
    if(a && a!==document.body && a.tagName==="BUTTON" && !a.classList.contains("opt")) return; // deixa o botão focado agir
    e.preventDefault(); next(); return;
  }
  if(e.key==="ArrowRight"){ e.preventDefault(); go(S.pos+1); }
  if(e.key==="ArrowLeft"){ e.preventDefault(); go(S.pos-1); }
});


/* ---------- banco de questões: carregar arquivo / modelo ---------- */
$("#btnLoad").addEventListener("click",()=>$("#fileInput").click());
$("#fileInput").addEventListener("change",e=>{
  const f=e.target.files && e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      const questoes = Array.isArray(d) ? d : d.questoes;
      const cfg = Array.isArray(d) ? {} : (d.config||{});
      const norm = normalizar(questoes);
      localStorage.setItem(BANK_KEY, JSON.stringify({config:cfg, questoes:norm.map(q=>Object.assign({},q,{correta:LETTERS[q.correta], erros:Object.fromEntries(Object.entries(q.erros).map(([k,v])=>[LETTERS[k],v]))}))}));
      location.reload();
    }catch(err){
      alertBox("Não foi possível carregar o arquivo", err instanceof SyntaxError ? "O arquivo não é um JSON válido. Confira vírgulas, aspas e colchetes." : err.message);
    }
    e.target.value="";
  };
  r.readAsText(f,"utf-8");
});
$("#btnDefault").addEventListener("click",()=>{
  confirmBox("Voltar ao banco padrão?","O banco carregado de arquivo será removido deste navegador.","Voltar",()=>{
    try{ localStorage.removeItem(BANK_KEY); }catch(e){} location.reload();
  });
});
$("#btnModel").addEventListener("click",()=>{
  const modelo={config:CONFIG, questoes:BANCO_PADRAO};
  const blob=new Blob([JSON.stringify(modelo,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="modelo_questoes.json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
if(ERRO_BANCO) setTimeout(()=>alertBox("Erro no banco padrão", ERRO_BANCO),0);

render();
</script>
</body>
</html>
